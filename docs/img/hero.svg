<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141A"/>
      <stop offset="1" stop-color="#22202A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="78" fill="#F5F5F7" font-size="40" font-weight="700">A battery gauge for your Claude usage</text>
  <text x="60" y="116" fill="#A1A1AA" font-size="20">Pro/Max plan limits and API credit · Claude Code · terminal · Mac menu bar · iPhone</text>

  <!-- Mac menu bar -->
  <g transform="translate(60,150)">
    <rect width="700" height="44" rx="10" fill="#2C2C34"/>
    <text x="20" y="28" fill="#D4D4D8" font-size="15">Finder   File   Edit   View   Go   Window   Help</text>
    <g transform="translate(470,11)">
      <rect x="0" y="2" width="30" height="16" rx="4" fill="none" stroke="#D4D4D8" stroke-width="1.6"/>
      <rect x="31" y="7" width="3" height="6" rx="1" fill="#D4D4D8"/>
      <rect x="2.5" y="4.5" width="11" height="11" rx="2" fill="#34C759"/>
      <text x="42" y="16" fill="#F5F5F7" font-size="15" font-weight="600">39%</text>
    </g>
    <text x="600" y="28" fill="#D4D4D8" font-size="15">Tue 1:59 PM</text>
    <!-- dropdown -->
    <g transform="translate(440,52)">
      <rect width="260" height="128" rx="10" fill="#3A3A44" stroke="#4B4B57"/>
      <text x="16" y="24" fill="#8E8E93" font-size="11">Claude plan</text>
      <text x="16" y="48" fill="#34C759" font-size="14" font-weight="600">5-hour: 62% left · resets 3:52 PM</text>
      <text x="16" y="72" fill="#34C759" font-size="14" font-weight="600">Week: 39% left · resets Fri 1 PM</text>
      <text x="16" y="94" fill="#8E8E93" font-size="12">From Claude Code, 3 min ago</text>
      <line x1="12" y1="104" x2="248" y2="104" stroke="#4B4B57"/>
      <text x="16" y="120" fill="#D4D4D8" font-size="12">Claude API · ≈ $18.09 left</text>
    </g>
    <text x="0" y="78" fill="#A1A1AA" font-size="14" font-weight="600" letter-spacing="1">MENU BAR (SwiftBar)</text>
  </g>

  <!-- Terminal card -->
  <g transform="translate(60,360)">
    <text x="0" y="-12" fill="#A1A1AA" font-size="14" font-weight="600" letter-spacing="1">TERMINAL</text>
    <rect width="700" height="190" rx="12" fill="#0E0E12" stroke="#2E2E38"/>
    <circle cx="20" cy="18" r="6" fill="#FF5F57"/><circle cx="40" cy="18" r="6" fill="#FEBC2E"/><circle cx="60" cy="18" r="6" fill="#28C840"/>
    <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
      <text x="20" y="58" fill="#A1A1AA">$ <tspan fill="#F5F5F7">claude-gauge</tspan></text>
      <text x="20" y="86" fill="#52525B">╭─ Claude plan ─────────────────────────────────────╮</text>
      <text x="20" y="110" fill="#52525B">│ <tspan fill="#D4D4D8">5-hour</tspan><tspan x="101" fill="#34C759">████████████░░░░░░░░</tspan>  <tspan fill="#F5F5F7" font-weight="700">62% left</tspan>  <tspan fill="#71717A">resets 3:52 PM</tspan></text>
      <text x="20" y="134" fill="#52525B">│ <tspan fill="#D4D4D8">Week</tspan><tspan x="101" fill="#34C759">████████░░░░░░░░░░░░</tspan>  <tspan fill="#F5F5F7" font-weight="700">39% left</tspan>  <tspan fill="#71717A">resets Fri 1 PM</tspan></text>
      <text x="20" y="158" fill="#52525B">│ <tspan fill="#71717A">from Claude Code · 3 min ago</tspan></text>
      <text x="20" y="180" fill="#52525B">╰───────────────────────────────────────────────────╯</text>
    </g>
  </g>

  <!-- Claude Code status line -->
  <g transform="translate(60,600)">
    <text x="0" y="-12" fill="#A1A1AA" font-size="14" font-weight="600" letter-spacing="1">CLAUDE CODE STATUS LINE</text>
    <rect width="700" height="40" rx="8" fill="#0E0E12" stroke="#2E2E38"/>
    <text x="16" y="26" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#D4D4D8">🔋 <tspan fill="#34C759">5h 62% ██░░</tspan><tspan fill="#71717A"> ↻3:52 PM</tspan> · <tspan fill="#34C759">wk 39% ██░░</tspan><tspan fill="#71717A"> ↻Fri 1 PM</tspan> · <tspan fill="#71717A">session $0.84</tspan></text>
  </g>

  <!-- iPhone widget -->
  <g transform="translate(830,150)">
    <text x="0" y="-12" fill="#A1A1AA" font-size="14" font-weight="600" letter-spacing="1">IPHONE WIDGET (Scriptable)</text>
    <rect width="310" height="490" rx="44" fill="#0B0B0E" stroke="#3F3F46" stroke-width="3"/>
    <rect x="115" y="16" width="80" height="22" rx="11" fill="#000"/>
    <g transform="translate(30,70)">
      <rect width="155" height="155" rx="24" fill="#1C1C1E"/>
      <text x="16" y="28" fill="#8E8E93" font-size="12" font-weight="600">Claude</text>
      <!-- 5h row -->
      <g transform="translate(16,44)">
        <text x="0" y="14" fill="#8E8E93" font-size="11" font-weight="600">5h</text>
        <rect x="22" y="1" width="62" height="16" rx="4" fill="none" stroke="#8E8E93" stroke-width="2"/>
        <rect x="86" y="5" width="3" height="8" rx="1.5" fill="#8E8E93"/>
        <rect x="25" y="4" width="35" height="10" rx="2.5" fill="#34C759"/>
        <text x="96" y="15" fill="#34C759" font-size="14" font-weight="700">62%</text>
      </g>
      <!-- wk row -->
      <g transform="translate(16,74)">
        <text x="0" y="14" fill="#8E8E93" font-size="11" font-weight="600">wk</text>
        <rect x="22" y="1" width="62" height="16" rx="4" fill="none" stroke="#8E8E93" stroke-width="2"/>
        <rect x="86" y="5" width="3" height="8" rx="1.5" fill="#8E8E93"/>
        <rect x="25" y="4" width="22" height="10" rx="2.5" fill="#34C759"/>
        <text x="96" y="15" fill="#34C759" font-size="14" font-weight="700">39%</text>
      </g>
      <text x="16" y="120" fill="#F5F5F7" font-size="11">API ≈ $18.09 left</text>
      <text x="16" y="142" fill="#8E8E93" font-size="10">as of 3m ago</text>
    </g>
    <g fill="#2C2C34">
      <rect x="200" y="70" width="64" height="64" rx="15"/><rect x="200" y="161" width="64" height="64" rx="15"/>
      <rect x="30" y="250" width="64" height="64" rx="15"/><rect x="113" y="250" width="64" height="64" rx="15"/><rect x="200" y="250" width="64" height="64" rx="15"/>
      <rect x="30" y="340" width="64" height="64" rx="15"/><rect x="113" y="340" width="64" height="64" rx="15"/><rect x="200" y="340" width="64" height="64" rx="15"/>
    </g>
  </g>
</svg>
